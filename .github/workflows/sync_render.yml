name: sync data and generate svg

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: running-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_NAME: wansho
  GITHUB_EMAIL: wanshojs@gmail.com

jobs:
  sync:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sync Garmin data
        id: data-sync
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
        run: python sync.py

      - name: Generate SVG
        if: steps.data-sync.outcome == 'success'
        run: python render.py

      - name: Persist generated data and encrypted token
        if: always()
        run: |
          git config --local user.email "${{ env.GITHUB_EMAIL }}"
          git config --local user.name "${{ env.GITHUB_NAME }}"
          git add -- \
            data/running_records_garmin_sync.json \
            data/running_records_combined.json \
            data/running.csv \
            data/garmin_tokens.enc \
            running.svg
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "同步并生成跑步图表"
          git push origin "HEAD:${GITHUB_REF_NAME}"
